name: Build and deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  package:
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      sha256: ${{ steps.fingerprint.outputs.sha256 }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Test CI workflow contract
        run: |
          & (Join-Path 'scripts' 'Test-CiWorkflow.ps1')

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore and build package
        run: |
          dotnet restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build --configuration Release --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Pack canonical tool
        run: dotnet pack Keboo.127Cache --configuration Release --no-build --output NuGet

      - name: Test package metadata
        run: |
          & (Join-Path 'scripts' 'Test-PackageMetadata.ps1') -PackageDirectory 'NuGet'

      - name: Test publish outcome reporting offline
        run: |
          & (Join-Path 'scripts' 'Test-NuGetPushOutput.ps1') -PackageDirectory 'NuGet'

      - name: Fingerprint canonical package
        id: fingerprint
        run: |
          $packages = @(Get-ChildItem -LiteralPath 'NuGet' -Filter '*.nupkg' -File)
          if ($packages.Count -ne 1 -or $packages[0].Name -notlike 'Keboo.127Cache.*.nupkg') {
            throw "Expected one Keboo.127Cache package; found $($packages.Count)."
          }
          $sha256 = (Get-FileHash -LiteralPath $packages[0].FullName -Algorithm SHA256).Hash
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "sha256=$sha256" -Encoding utf8
          Write-Host "CANONICAL_PACKAGE_SHA256=$sha256"

      - name: Upload canonical NuGet artifact
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: NuGet
          path: NuGet
          if-no-files-found: error

  build:
    needs: package
    if: ${{ always() }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Require canonical package
        env:
          PACKAGE_RESULT: ${{ needs.package.result }}
          PACKAGE_ARTIFACT_ID: ${{ needs.package.outputs.artifact-id }}
          EXPECTED_PACKAGE_SHA256: ${{ needs.package.outputs.sha256 }}
        run: |
          if ($env:PACKAGE_RESULT -ne 'success' -or
              $env:PACKAGE_ARTIFACT_ID -notmatch '^[0-9]+$' -or
              $env:EXPECTED_PACKAGE_SHA256 -notmatch '^[0-9a-fA-F]{64}$') {
            throw 'The canonical package job did not produce a valid artifact ID and SHA-256.'
          }

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: dotnet restore
        run: dotnet restore

      - name: dotnet build
        run: dotnet build --configuration Release --no-restore

      # Microsoft Testing Platform can stop the run once 10 tests fail in CI:
      # https://learn.microsoft.com/dotnet/core/testing/microsoft-testing-platform-cli-options
      # To enable retries, add Microsoft.Testing.Extensions.Retry to the test project, then pass
      # --retry-failed-tests plus --retry-failed-tests-max-percentage <value> to skip reruns when too many tests fail:
      # https://learn.microsoft.com/dotnet/core/testing/microsoft-testing-platform-retry#retry-1
      - name: dotnet test
        if: runner.os != 'Linux'
        run: |
          & (Join-Path 'scripts' 'Invoke-CiTests.ps1')

      - name: dotnet test with coverage
        id: coverage
        if: runner.os == 'Linux'
        run: |
          & (Join-Path 'scripts' 'Invoke-CiTests.ps1') -CoverageDirectory (Join-Path 'TestResults' 'ci-coverage')

      - name: Test solution discovery guard
        if: runner.os == 'Linux'
        run: |
          & (Join-Path 'scripts' 'Test-CiDiscovery.ps1') -BaselineCoverageDirectory (Join-Path 'TestResults' 'ci-coverage')

      - name: ReportGenerator
        if: runner.os == 'Linux'
        uses: danielpalme/ReportGenerator-GitHub-Action@5.5.12
        with:
          reports: ${{ steps.coverage.outputs.reports }}
          targetdir: coveragereport
          reporttypes: Html;MarkdownSummaryGithub
          title: 'Code Coverage'
  
      - name: Write PR Number
        if: runner.os == 'Linux' && github.event_name == 'pull_request'
        run: |
          Set-Content -Path (Join-Path 'coveragereport' 'PullRequestNumber') -Value '${{ github.event.number }}'
  
      - name: Upload Code Coverage Report
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: CodeCoverage
          path: coveragereport
          if-no-files-found: error

      - name: Download canonical NuGet artifact
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.package.outputs.artifact-id }}
          path: NuGet
          merge-multiple: true
          digest-mismatch: error

      - name: Test downloaded package metadata
        env:
          EXPECTED_PACKAGE_SHA256: ${{ needs.package.outputs.sha256 }}
        run: |
          & (Join-Path 'scripts' 'Test-PackageMetadata.ps1') -PackageDirectory 'NuGet' -ExpectedSha256 $env:EXPECTED_PACKAGE_SHA256

      - name: Test packed tool installation and server
        env:
          EXPECTED_PACKAGE_SHA256: ${{ needs.package.outputs.sha256 }}
        run: |
          & (Join-Path 'scripts' 'Test-PackedTool.ps1') -PackageDirectory 'NuGet' -ExpectedSha256 $env:EXPECTED_PACKAGE_SHA256

      - name: Test packed tool provenance guard
        if: runner.os == 'Linux'
        env:
          EXPECTED_PACKAGE_SHA256: ${{ needs.package.outputs.sha256 }}
        run: |
          & (Join-Path 'scripts' 'Test-PackedToolProvenance.ps1') -PackageDirectory 'NuGet' -ExpectedSha256 $env:EXPECTED_PACKAGE_SHA256

      - name: Test install-state recovery
        run: |
          & (Join-Path 'scripts' 'Test-InstallState.ps1')

  automerge:
    if: ${{ github.event_name == 'pull_request' && github.actor == 'dependabot[bot]' }}
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pull-requests: write
      contents: write

    steps:
      - name: Enable auto-merge for Dependabot PRs
        run: gh pr merge --auto --squash "${{ github.event.pull_request.number }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

  deploy-nuget:
    # Publishing is paused until the owner separately authorizes it.
    # See "Release procedure and safety" in README.md before changing this guard.
    if: ${{ false }}
    runs-on: ubuntu-latest
    needs: [package, build]
    
    # Required for Trusted Publishing: allows GitHub to issue OIDC tokens for this job
    # This enables secure, keyless authentication with NuGet.org
    permissions:
      id-token: write
    
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Download canonical NuGet artifact
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ needs.package.outputs.artifact-id }}
          merge-multiple: true
          digest-mismatch: error

      - name: Verify release artifact identity
        env:
          EXPECTED_PACKAGE_SHA256: ${{ needs.package.outputs.sha256 }}
        run: |
          $packages = @(Get-ChildItem -LiteralPath $env:GITHUB_WORKSPACE -Filter '*.nupkg' -File)
          if ($packages.Count -ne 1 -or $packages[0].Name -notlike 'Keboo.127Cache.*.nupkg') {
            throw "Expected one Keboo.127Cache release package; found $($packages.Count)."
          }
          $actual = (Get-FileHash -LiteralPath $packages[0].FullName -Algorithm SHA256).Hash
          if ($actual -ne $env:EXPECTED_PACKAGE_SHA256) {
            throw "Release package SHA-256 mismatch: expected $env:EXPECTED_PACKAGE_SHA256, actual $actual."
          }
          Write-Host "RELEASE_PACKAGE_SHA256=$actual"

      # ====================================================================================
      # OPTION 1: Trusted Publishing (RECOMMENDED - Default)
      # ====================================================================================
      # Trusted Publishing uses short-lived credentials instead of long-lived API keys.
      # This is more secure because:
      # - No API keys to manage, rotate, or accidentally leak
      # - Temporary credentials are valid for only 1 hour
      # - Each token can only be used once
      # 
      # Setup required on nuget.org (one-time):
      # 1. Log into nuget.org
      # 2. Go to your profile → "Trusted Publishing"
      # 3. Add a new policy with:
      #    - Repository Owner: your-org or username
      #    - Repository: your-repo-name
      #    - Workflow File: build-and-deploy.yml (file name only, no path)
      #    - Environment: (optional, leave empty if not using GitHub environments)
      # 
      # You'll also need to store your nuget.org username (NOT email) as a secret:
      # - Go to GitHub repository → Settings → Secrets and variables → Actions
      # - Add a new secret named NUGET_USER with your nuget.org profile username
      # ====================================================================================

      - name: NuGet login (OIDC → temporary API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}  # Your nuget.org username (profile name), NOT email

      - name: Push NuGet (Trusted Publishing)
        env:
          NUGET_PUSH_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          $packages = @(Get-ChildItem -LiteralPath $env:GITHUB_WORKSPACE -Filter '*.nupkg' -File)
          if ($packages.Count -ne 1 -or $packages[0].Name -notlike 'Keboo.127Cache.*.nupkg') {
            throw 'Expected exactly one Keboo.127Cache package to publish.'
          }
          $lines = @(& dotnet nuget push $packages[0].FullName --api-key $env:NUGET_PUSH_API_KEY `
            --source https://api.nuget.org/v3/index.json --skip-duplicate --no-symbols --force-english-output 2>&1)
          $exitCode = $LASTEXITCODE
          $lines | ForEach-Object { Write-Host $_ }
          if ($exitCode -ne 0) { throw "NuGet push failed with exit code $exitCode." }
          $published = @($lines | Where-Object { "$_" -match '^\s*Your package was pushed\.\s*$' }).Count
          $duplicate = @($lines | Where-Object { "$_" -match "^\s*Package '.+' already exists at feed '.+'\.\s*$" }).Count
          if ($published -eq 1 -and $duplicate -eq 0) {
            Write-Host "NUGET_PUBLISH_OUTCOME=published: NuGet accepted $($packages[0].Name)."
          } elseif ($published -eq 0 -and $duplicate -eq 1) {
            Write-Host "NUGET_PUBLISH_OUTCOME=duplicate: $($packages[0].Name) already exists; no package was published."
          } else {
            throw 'NuGet push returned success but the publication outcome was ambiguous; inspect the preceding output.'
          }

      # ====================================================================================
      # OPTION 2: Traditional API Key (Legacy Method)
      # ====================================================================================
      # This is the older method using a long-lived API key stored as a GitHub secret.
      # Less secure than Trusted Publishing because:
      # - API keys never expire (unless manually rotated)
      # - If leaked, they can be used indefinitely
      # - Requires manual secret management
      # 
      # To use this method instead:
      # 1. Comment out the "NuGet login" step above
      # 2. Comment out the "Push NuGet (Trusted Publishing)" step above
      # 3. Uncomment the step below
      # 4. Remove the "permissions: id-token: write" section from this job
      # 5. Ensure you have a NUGET_API_KEY secret configured in GitHub:
      #    - Get an API key from nuget.org → Account Settings → API Keys
      #    - Add it to GitHub repository → Settings → Secrets → Actions → NUGET_API_KEY
      # ====================================================================================

      # - name: Push NuGet (API Key)
      #   run: dotnet nuget push ${{ github.workspace }}/*nupkg --source https://api.nuget.org/v3/index.json -k ${{ secrets.NUGET_API_KEY }} --skip-duplicate
